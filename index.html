<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVG COET Campus Guide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  /* =========================================================
     PVG COET Campus Guide — Upgraded Campus Ledger + Live Map
     Theme: Deep Navy + Brass Gold + Fraunces & Inter
  ========================================================= */
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --cb-navy:        #10233F;
    --cb-navy-deep:   #0B1930;
    --cb-navy-mid:    #18335C;
    --cb-gold:        #C6981F;
    --cb-gold-soft:   #E7C165;
    --cb-gold-glow:   rgba(198, 152, 31, 0.25);
    --cb-paper:       #FBF8F1;
    --cb-ink:         #1E2430;
    --cb-slate:       #67707E;
    --cb-line:        #E4DCC8;
    --cb-radius:      14px;
    --cb-shadow:      0 18px 40px rgba(11, 25, 48, 0.28);
    --cb-font-head:   'Fraunces', Georgia, serif;
    --cb-font-body:   'Inter', system-ui, -apple-system, sans-serif;
  }

  #campusBotLauncher, #campusBotPanel, #campusBotPanel * {
    box-sizing: border-box;
    font-family: var(--cb-font-body);
  }

  /* ---------- Floating Launcher with Pulse Ring ---------- */
  .cb-launcher {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 2px solid var(--cb-gold-soft);
    cursor: pointer;
    background: linear-gradient(135deg, var(--cb-navy-mid), var(--cb-navy-deep));
    color: var(--cb-gold-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--cb-shadow), 0 0 0 0 var(--cb-gold-glow);
    z-index: 9998;
    transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease;
    animation: cb-pulse 2.8s infinite;
  }
  .cb-launcher:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 22px 44px rgba(11, 25, 48, 0.36), 0 0 24px var(--cb-gold-glow);
  }
  @keyframes cb-pulse {
    0% { box-shadow: var(--cb-shadow), 0 0 0 0 rgba(231, 193, 101, 0.45); }
    70% { box-shadow: var(--cb-shadow), 0 0 0 14px rgba(231, 193, 101, 0); }
    100% { box-shadow: var(--cb-shadow), 0 0 0 0 rgba(231, 193, 101, 0); }
  }
  .cb-launcher-icon { width: 27px; height: 27px; }
  .cb-launcher-logo {
    display: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
  }

  /* ---------- Panel Shell ---------- */
  .cb-panel {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    margin: 0 auto;
    background: var(--cb-paper);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    opacity: 0;
    transform: translateY(12px) scale(0.985);
    pointer-events: none;
    transition: opacity 0.24s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cb-panel.cb-open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* ---------- Header + Cartoon Mascot ---------- */
  .cb-header {
    position: relative;
    background: linear-gradient(125deg, var(--cb-navy-deep) 0%, var(--cb-navy) 55%, var(--cb-navy-mid) 100%);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 3px solid var(--cb-gold);
    flex-shrink: 0;
    overflow: hidden;
  }
  .cb-header::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -60%;
    width: 45%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(231, 193, 101, 0.14), transparent);
    transform: rotate(22deg);
    animation: cb-sheen 6s infinite ease-in-out;
    pointer-events: none;
  }
  @keyframes cb-sheen {
    0%, 70% { left: -60%; }
    100% { left: 130%; }
  }
  .cb-logo {
    width: 42px;
    height: 42px;
    object-fit: contain;
    background: #fff;
    border-radius: 10px;
    padding: 4px;
    border: 1.5px solid var(--cb-gold-soft);
    flex-shrink: 0;
    z-index: 1;
  }
  .cb-mascot {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    z-index: 1;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
    animation: cb-float 3.2s ease-in-out infinite;
  }
  @keyframes cb-float {
    0%, 100% { transform: translateY(0px) rotate(-1deg); }
    50% { transform: translateY(-3px) rotate(1.5deg); }
  }
  .cb-header-text { flex: 1; min-width: 0; z-index: 1; }
  .cb-header-text h1 {
    margin: 0;
    font-family: var(--cb-font-head);
    font-weight: 600;
    font-size: 17.5px;
    color: #fff;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .cb-live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34D399;
    box-shadow: 0 0 8px #34D399;
    display: inline-block;
    flex-shrink: 0;
  }
  .cb-header-text p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--cb-gold-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cb-close {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(231, 193, 101, 0.25);
    color: #EDE7D6;
    cursor: pointer;
    padding: 7px;
    border-radius: 10px;
    flex-shrink: 0;
    z-index: 1;
    transition: background 0.18s ease, transform 0.18s ease;
  }
  .cb-close:hover {
    background: rgba(255, 255, 255, 0.16);
    transform: rotate(90deg);
  }

  /* ---------- Body + Preserved Watermark Background ---------- */
  .cb-body {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: var(--cb-paper);
  }
  .cb-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url('pvg_entrance.png');
    background-size: cover;
    background-position: center;
    opacity: 0.11;
    filter: grayscale(15%) contrast(1.05);
    z-index: 0;
    pointer-events: none;
  }
  .cb-messages {
    position: relative;
    z-index: 1;
    height: 100%;
    overflow-y: auto;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    max-width: 740px;
    width: 100%;
    margin: 0 auto;
    scroll-behavior: smooth;
  }

  /* ---------- Message Bubbles & Cards ---------- */
  .cb-msg {
    max-width: 86%;
    font-size: 13.5px;
    line-height: 1.55;
    padding: 11px 14px;
    border-radius: 14px;
    animation: cb-rise 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes cb-rise {
    from { opacity: 0; transform: translateY(8px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .cb-msg.bot {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    color: var(--cb-ink);
    border-left: 3.5px solid var(--cb-gold);
    border-top: 1px solid rgba(228, 220, 200, 0.7);
    border-right: 1px solid rgba(228, 220, 200, 0.7);
    border-bottom: 1px solid rgba(228, 220, 200, 0.7);
    box-shadow: 0 6px 18px rgba(16, 35, 63, 0.08);
  }
  .cb-msg.bot .cb-loc-name {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--cb-font-head);
    font-weight: 600;
    font-size: 15px;
    color: var(--cb-navy);
    margin-bottom: 4px;
  }
  .cb-meta-pill {
    display: inline-block;
    font-size: 11.5px;
    color: #6D5614;
    background: #FFF6DC;
    border: 1px solid #EED58B;
    border-radius: 8px;
    padding: 3px 8px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .cb-verify-note {
    margin-top: 6px;
    font-size: 11.5px;
    color: #8A5300;
    background: #FFF9EB;
    border-left: 2.5px solid #E7C165;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .cb-msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--cb-navy-mid), var(--cb-navy));
    color: #F6F1E3;
    box-shadow: 0 6px 16px rgba(11, 25, 48, 0.18);
  }
  .cb-msg .cb-chip-row {
    margin-top: 9px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .cb-msg .cb-chip-row button {
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--cb-line);
    background: var(--cb-paper);
    color: var(--cb-navy);
    cursor: pointer;
    transition: all 0.16s ease;
  }
  .cb-msg .cb-chip-row button:hover {
    border-color: var(--cb-gold);
    background: #FFF7DE;
    transform: translateY(-1px);
  }

  /* ---------- Quick Suggestion Chips ---------- */
  .cb-suggestions {
    flex-shrink: 0;
    display: flex;
    gap: 7px;
    padding: 9px 16px;
    overflow-x: auto;
    border-top: 1px solid var(--cb-line);
    background: rgba(251, 248, 241, 0.96);
    max-width: 740px;
    width: 100%;
    margin: 0 auto;
    scrollbar-width: thin;
  }
  .cb-chip {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--cb-line);
    background: #fff;
    color: var(--cb-navy);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.16s ease;
  }
  .cb-chip:hover {
    border-color: var(--cb-gold);
    background: #FFFBF0;
    transform: translateY(-1px);
  }

  /* ---------- Input Row ---------- */
  .cb-input-row {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--cb-line);
    background: #fff;
    max-width: 740px;
    width: 100%;
    margin: 0 auto;
  }
  #campusBotInput {
    flex: 1;
    border: 1.5px solid var(--cb-line);
    border-radius: 11px;
    padding: 10px 13px;
    font-size: 13.5px;
    outline: none;
    background: var(--cb-paper);
    color: var(--cb-ink);
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  #campusBotInput:focus {
    border-color: var(--cb-gold);
    box-shadow: 0 0 0 3px var(--cb-gold-glow);
    background: #fff;
  }
  .cb-send {
    width: 42px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--cb-navy-mid), var(--cb-navy));
    color: var(--cb-gold-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }
  .cb-send:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(16, 35, 63, 0.24);
  }

  /* ---------- Credit Line ---------- */
  .cb-credit {
    flex-shrink: 0;
    text-align: center;
    font-size: 11px;
    color: var(--cb-slate);
    background: #fff;
    padding: 6px 0 10px;
    margin: 0;
  }

  /* ---------- Live Map Navigation Styles ---------- */
  .cb-map-chip {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--cb-gold);
    background: linear-gradient(135deg, var(--cb-navy-mid), var(--cb-navy));
    color: var(--cb-gold-soft);
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 3px 10px rgba(16, 35, 63, 0.16);
    transition: transform 0.16s ease;
  }
  .cb-map-chip:hover { transform: translateY(-1px); }

  .cb-nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 9px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 13px;
    border: 1px solid var(--cb-gold);
    border-radius: 9px;
    background: linear-gradient(135deg, var(--cb-navy-mid), var(--cb-navy));
    color: var(--cb-gold-soft);
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }
  .cb-nav-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(16, 35, 63, 0.22);
  }

  /* Map Screen */
  .cm-panel {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: none;
    flex-direction: column;
    background: var(--cb-paper);
    font-family: var(--cb-font-body);
  }
  .cm-panel.cm-open { display: flex; }
  .cm-panel * { box-sizing: border-box; }

  #campusMap { flex: 1; min-height: 0; }

  .cm-controls {
    flex-shrink: 0;
    display: grid;
    gap: 8px;
    width: 100%;
    max-width: 740px;
    margin: 0 auto;
    padding: 12px 16px 14px;
    background: #fff;
    border-top: 2px solid var(--cb-gold);
  }
  .cm-controls label {
    display: grid;
    gap: 3px;
    font-size: 13px;
    font-weight: 600;
    color: var(--cb-navy);
  }
  .cm-controls select {
    font: inherit;
    font-weight: 400;
    padding: 9px;
    border: 1px solid var(--cb-line);
    border-radius: 8px;
    background: var(--cb-paper);
    color: var(--cb-ink);
  }
  .cm-row { display: flex; gap: 8px; }
  .cm-controls button {
    font: inherit;
    font-weight: 600;
    padding: 11px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .cm-controls button:active { transform: scale(0.98); }
  #cmGo { flex: 1; background: var(--cb-navy); color: var(--cb-gold-soft); }
  #cmStop { background: #EDE7D6; color: var(--cb-navy); }
  #campusMapBack { background: #FFF5D6; color: var(--cb-navy); border: 1px solid var(--cb-gold); }
  .cm-controls button:disabled { opacity: .5; cursor: default; }
  #cmStatus { margin: 0; font-size: 13.5px; font-weight: 500; color: var(--cb-ink); min-height: 1.3em; }
</style>
</head>
<body>

  <!-- FLOATING LAUNCHER -->
  <button id="campusBotLauncher" class="cb-launcher" aria-label="Open Campus Guide">
    <svg class="cb-launcher-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <img id="campusBotLauncherLogo" class="cb-launcher-logo" src="pvg_logo.png" alt="Logo">
  </button>

  <!-- CHATBOT PANEL -->
  <div id="campusBotPanel" class="cb-panel" aria-hidden="true">
    <header class="cb-header">
      <img src="pvg_logo.png" alt="PVG Logo" class="cb-logo" onerror="this.style.display='none'">

      <!-- Cartoon Campus Mascot SVG -->
      <svg class="cb-mascot" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="34" r="21" fill="#FFE6A3" stroke="#10233F" stroke-width="2.5"/>
        <polygon points="32,8 6,20 32,30 58,20" fill="#10233F" stroke="#E7C165" stroke-width="2"/>
        <line x1="52" y1="22" x2="52" y2="36" stroke="#E7C165" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="52" cy="38" r="3" fill="#E7C165"/>
        <circle cx="24" cy="36" r="2.8" fill="#10233F"/>
        <circle cx="40" cy="36" r="2.8" fill="#10233F"/>
        <circle cx="25" cy="35" r="1" fill="#fff"/>
        <circle cx="41" cy="35" r="1" fill="#fff"/>
        <path d="M25 43 Q32 49 39 43" stroke="#10233F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <circle cx="19" cy="40" r="3" fill="#FF9AA2" opacity="0.65"/>
        <circle cx="45" cy="40" r="3" fill="#FF9AA2" opacity="0.65"/>
      </svg>

      <div class="cb-header-text">
        <h1><span class="cb-live-dot"></span>PVG COET Campus Guide</h1>
        <p>Find any lab, office, canteen, or facility</p>
      </div>

      <button id="campusBotClose" class="cb-close" aria-label="Close Guide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div class="cb-body">
      <div id="campusBotMessages" class="cb-messages"></div>
    </div>

    <div id="campusBotSuggestions" class="cb-suggestions">
      <button class="cb-map-chip" id="cbMapChip">🗺️ Live map</button>
      <button class="cb-chip" data-q="Canteen & Dining">🍽️ Canteen & Food</button>
      <button class="cb-chip" data-q="Principal Office">🏛️ Principal Office</button>
      <button class="cb-chip" data-q="FE HOD Office">🎓 FE HOD Office</button>
      <button class="cb-chip" data-q="Computer Lab">💻 Computer Lab</button>
      <button class="cb-chip" data-q="Library">📚 Library</button>
      <button class="cb-chip" data-q="Washroom">🚻 Washroom</button>
    </div>

    <form id="campusBotForm" class="cb-input-row">
      <input type="text" id="campusBotInput" placeholder="Ask about any room, office, canteen, or facility..." autocomplete="off">
      <button type="submit" class="cb-send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
    <p class="cb-credit">PVG's College of Engineering and Technology &middot; Made by Ganesh Umape</p>
  </div>

  <!-- LIVE MAP PANEL -->
  <div id="campusMapPanel" class="cm-panel" aria-hidden="true">
    <div id="campusMap"></div>
    <div class="cm-controls">
      <div class="cm-row">
        <label style="flex:1">From: <select id="cmFrom"></select></label>
        <label style="flex:1">To: <select id="cmTo"></select></label>
      </div>
      <p id="cmStatus">Choose your destination, then tap Start navigation.</p>
      <div class="cm-row">
        <button id="cmGo" type="button">🧭 Start navigation</button>
        <button id="cmStop" type="button" disabled>⏹️ Stop</button>
        <button id="campusMapBack" type="button">💬 Back to chat</button>
      </div>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  const PLACES = [

  const BUILDINGS = [
    [/fe building|first year/i, "FE Building"],
    [/boys hostel/i, "Boys Hostel"],
    [/girls hostel|shadaygu|shatayu/i, "Girls Hostel"],
    [/main building|new building/i, "Main Building"],
    [/muktangan|playground/i, "Muktangan English Medium School"],
    [/auditorium|library|workshop/i, "Library & Workshop Building"],
    [/parking/i, "Cycle Parking"]
  ];

  const ARRIVED_M = 20;
  const WALK_M_PER_MIN = 80;

  const $ = id => document.getElementById(id);
  const panel = $("campusMapPanel"), fromSel = $("cmFrom"), toSel = $("cmTo");
  const goBtn = $("cmGo"), stopBtn = $("cmStop");
  const say = t => { $("cmStatus").textContent = t; };

  let map = null, me = null, route = null, trail = null;
  let trailPts = [], watchId = null, dest = null, destLL = null, first = true;
  const routeStyle = { color: "#10233F", weight: 5, dashArray: "8 10" };

  fromSel.add(new Option("📍 My current location", "gps"));
  toSel.add(new Option("Select destination", ""));
  PLACES.forEach((p, i) => {
    fromSel.add(new Option(p.name, i));
    toSel.add(new Option(p.name, i));
  });

  const rad = x => x * Math.PI / 180;
  function dist(a, b) {
    const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
    return 2 * 6371000 * Math.asin(Math.sqrt(h));
  }

  function initMap() {
    if (map) return;
    map = L.map("campusMap").setView([18.4898, 73.8527], 18);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);
    PLACES.forEach((p, i) => {
      L.circleMarker([p.lat, p.lng], {
        radius: 8,
        color: "#10233F",
        weight: 3,
        fillColor: "#C6981F",
        fillOpacity: 1
      })
        .addTo(map)
        .bindTooltip("📌 " + p.name)
        .on("click", () => { toSel.value = i; });
    });
  }

  function clearLayers() {
    [me, route, trail].forEach(l => l && map.removeLayer(l));
    me = route = trail = null;
    trailPts = [];
  }

  function stop() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    goBtn.disabled = false;
    stopBtn.disabled = true;
  }

  function start() {
    if (toSel.value === "") { say("⚠️ Select a destination first."); return; }
    if (!navigator.geolocation) { say("⚠️ This browser can’t share your location."); return; }
    stop();
    clearLayers();
    dest = PLACES[toSel.value];
    destLL = [dest.lat, dest.lng];
    first = true;
    trail = L.polyline([], { color: "#C6981F", weight: 5 }).addTo(map);

    if (fromSel.value !== "gps") {
      const f = PLACES[fromSel.value];
      route = L.polyline([[f.lat, f.lng], destLL], routeStyle).addTo(map);
      map.fitBounds(route.getBounds(), { padding: [60, 60] });
      say(`📏 ${Math.round(dist([f.lat, f.lng], destLL))} m from ${f.name} to ${dest.name}. Waiting for your GPS location…`);
    } else {
      say("🛰️ Finding your live GPS location…");
    }
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {
      enableHighAccuracy: true,
      maximumAge: 2000,
      timeout: 20000
    });
    goBtn.disabled = true;
    stopBtn.disabled = false;
  }

  function onPos(pos) {
    const here = [pos.coords.latitude, pos.coords.longitude];
    if (!me) {
      me = L.circleMarker(here, {
        radius: 9,
        color: "#fff",
        weight: 3,
        fillColor: "#1f6feb",
        fillOpacity: 1
      }).addTo(map);
    } else {
      me.setLatLng(here);
    }
    trailPts.push(here);
    trail.setLatLngs(trailPts);

    if (fromSel.value === "gps") {
      if (route) map.removeLayer(route);
      route = L.polyline([here, destLL], routeStyle).addTo(map);
    }
    if (first) {
      map.fitBounds([here, destLL], { padding: [60, 60] });
      first = false;
    }

    const d = dist(here, destLL);
    if (d <= ARRIVED_M) {
      say(`🎉 You have arrived at ${dest.name}!`);
      stop();
      return;
    }
    const mins = Math.max(1, Math.round(d / WALK_M_PER_MIN));
    const weak = pos.coords.accuracy > 50 ? ` ⚠️ GPS signal is weak (±${Math.round(pos.coords.accuracy)} m).` : "";
    say(`🚶 ${Math.round(d)} m to ${dest.name}, about ${mins} min walk.${weak}`);
  }

  function onErr(e) {
    const msg = {
      1: "🔒 Location is blocked. Allow location for this site in your browser settings, then try again.",
      2: "📡 Your location is not available. Move to an open area and try again.",
      3: "⏱️ Finding your location took too long. Move to an open area and try again."
    };
    say(msg[e.code] || "⚠️ Could not get your location.");
    stop();
  }

  function openMap(destName) {
    panel.classList.add("cm-open");
    panel.setAttribute("aria-hidden", "false");
    initMap();
    setTimeout(() => map.invalidateSize(), 60);
    if (destName) {
      const i = PLACES.findIndex(p => p.name === destName);
      if (i >= 0) toSel.value = i;
      say("🧭 Tap Start navigation when you are ready to walk.");
    } else {
      say("🗺️ Choose your destination, then tap Start navigation.");
    }
  }

  function closeMap() {
    stop();
    panel.classList.remove("cm-open");
    panel.setAttribute("aria-hidden", "true");
  }

  function placeForBuilding(text) {
    const hit = BUILDINGS.find(b => b[0].test(text));
    return hit ? hit[1] : null;
  }

  goBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", () => { stop(); say("⏹️ Navigation stopped."); });
  $("campusMapBack").addEventListener("click", closeMap);
  $("cbMapChip").addEventListener("click", () => openMap());

  function getLocationEmoji(loc) {
    const text = [loc.name, loc.category, loc.description, ...(loc.keywords || [])].join(" ").toLowerCase();
    if (/canteen|dining|mess|food|snack|lunch|tea|coffee|kitchen/.test(text)) return "🍽️";
    if (/library|reading|book/.test(text)) return "📚";
    if (/computer|software|coding|pc|programming/.test(text)) return "💻";
    if (/lab|laboratory|chemistry|electronics|electrical|thermodynamics|kinematics|vlsi|ink|package|binding/.test(text)) return "🔬";
    if (/washroom|toilet|restroom|bathroom|hand wash/.test(text)) return "🚻";
    if (/water|cooler/.test(text)) return "💧";
    if (/lift|elevator/.test(text)) return "🛗";
    if (/parking|cycle|bike|car/.test(text)) return "🅿️";
    if (/gym|playground|football|kabaddi|archery|stage|rangmanch|auditorium/.test(text)) return "🏟️";
    if (/principal|director|hod|office|accounts|admission|student section|admin/.test(text)) return "🏛️";
    if (/classroom|class|room|hostel/.test(text)) return "🏫";
    if (/xerox|stationery|store|3d/.test(text)) return "🛍️";
    return "📍";
  }

  function isFoodOrCanteenQuery(q) {
    return /\b(canteen|food|eat|eating|hungry|lunch|breakfast|snacks?|tea|chai|coffee|mess|dining|tiffin)\b/i.test(q);

    chatInput.focus();
  });

  closeBtn.addEventListener("click", () => {
    chatPanel.classList.remove("cb-open");
    chatPanel.setAttribute("aria-hidden", "true");
  });

  document.querySelectorAll(".cb-suggestions .cb-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const q = btn.getAttribute("data-q");
      if (q) {
        chatInput.value = q;
        ask(q);
      }
    });
  });

  chatForm.addEventListener("submit", e => {
    e.preventDefault();
    const val = chatInput.value.trim();
    if (!val) return;
    chatInput.value = "";
    ask(val);
  });

  function addMsg(content, sender, isHtml = false) {
    const div = document.createElement("div");
    div.className = "cb-msg " + sender;
    if (isHtml) {
      div.innerHTML = content;
    } else {
      div.textContent = content;
    }
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div;
  }

  function initChat() {
    messagesDiv.innerHTML = "";
    const welcomeHtml = `
      <span class="cb-loc-name">🎓 Namaste! Welcome to PVG COET Guide</span>
      <p style="margin:0 0 8px;">Ask me about any <strong>lab 🔬</strong>, <strong>office 🏛️</strong>, <strong>canteen/food 🍽️</strong>, <strong>library 📚</strong>, or <strong>washroom 🚻</strong> across all 173 campus spots!</p>
      <div class="cb-chip-row">
        <button type="button" data-quick="Canteen & Dining">🍽️ Canteen & Food</button>
        <button type="button" data-quick="Accounts Office">💰 Accounts Office</button>
        <button type="button" data-quick="Dept. of Computer">💻 Comp Dept</button>
        <button type="button" data-quick="2-Wheeler Parking">🏍️ Parking</button>
      </div>
    `;
    const wDiv = addMsg(welcomeHtml, "bot", true);
    wDiv.querySelectorAll("[data-quick]").forEach(b => {
      b.addEventListener("click", () => ask(b.getAttribute("data-quick")));
    });
  }

  /* Optional external campus_data.json sync while keeping all 173 locations safe */
  fetch("campus_data.json")
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => {
      if (d && Array.isArray(d.locations) && d.locations.length >= 10) {
        DATA = d;
      }
    })
    .catch(() => {
      DATA = EMBEDDED_DATA;
    });

  function search(raw) {
    if (!DATA || !DATA.locations) return { type: "none" };
    const q = raw.toLowerCase().trim();

    // Dedicated canteen / food / mess / dining response
    if (isFoodOrCanteenQuery(q)) {
      const foodSpots = DATA.locations.filter(l =>
        /dining|kitchen|mess|food|canteen|snack/i.test(
          [l.name, l.category, l.description, ...(l.keywords || [])].join(" ")
        )
      );
      return {
        type: "food_guide",
        options: foodSpots
      };
    }

    // Intercept broad category queries
    if (q === "office" || q === "offices") {
      const offices = DATA.locations.filter(l => (l.name + " " + (l.category || "")).toLowerCase().includes("office"));
      return { type: "category_list", title: "🏛️ Here are the offices on campus:", options: offices.slice(0, 12) };
    }
    if (/washroom|toilet|restroom|bathroom/.test(q)) {
      const washrooms = DATA.locations.filter(l => (l.name + " " + (l.category || "")).toLowerCase().match(/washroom|toilet|restroom/));
      return { type: "category_list", title: "🚻 Here are the washrooms across campus:", options: washrooms.slice(0, 12) };
    }
    if (/^(lab|labs|laboratory)$/.test(q)) {
      const labs = DATA.locations.filter(l => (l.category || "").toLowerCase() === "lab");
      return { type: "category_list", title: "🔬 Here are labs on campus:", options: labs.slice(0, 12) };
    }

    // Building alias boost
    const matchedBuildingIds = new Set();
    (DATA.buildings || []).forEach(b => {
      if ((b.aliases || []).some(a => q.includes(a.toLowerCase()))) {
        matchedBuildingIds.add(b.id);
      }
    });

    // Keyword scoring search
    const words = q.split(/\s+/).filter(w => w.length > 1);
    let sc = DATA.locations.map(l => {
      let s = 0;
      const nameL = (l.name || "").toLowerCase();
      const blob = [l.name, l.building, l.floor, l.rooms || "", l.category, l.description, ...(l.keywords || [])].join(" ").toLowerCase();

      if (nameL === q) s += 12;
      else if (nameL.includes(q)) s += 7;
      if (blob.includes(q)) s += 5;
      if (matchedBuildingIds.has(l.building_id)) s += 4;

      words.forEach(w => {
        if (w.length > 2 && blob.includes(w)) s += 2;
        if ((l.rooms || "").toLowerCase().split(/[\s,/-]+/).includes(w)) s += 6;
      });

      return { l, s };
    }).filter(x => x.s > 0);

    if (!sc.length) return { type: "none" };

    sc.sort((a, b) => b.s - a.s);
    const max = sc[0].s;
    const top = sc.filter(x => x.s === max).map(x => x.l);

    if (top.length === 1) return { type: "answer", loc: top[0] };
    return {
      type: "category_list",
      title: "✨ I found a few matching locations. Tap one to view details:",
      options: sc.slice(0, 8).map(x => x.l)
    };
  }

  function ask(q) {
    addMsg(q, "user");

    if (/^(hi|hii|hello|hey|namaste)\b/i.test(q)) {
      addMsg("👋 Hello! Ask me where any lab 🔬, office 🏛️, canteen/food 🍽️, library 📚, or washroom 🚻 is on the PVG campus.", "bot");
      return;
    }

    const res = search(q);

    if (res.type === "food_guide") {
      let listHtml = "";
      if (res.options && res.options.length) {
        listHtml = res.options.map(spot =>
          `<div style="margin:6px 0; padding:7px 9px; background:#FBF8F1; border-radius:8px; border:1px solid #E4DCC8;">
            <strong>🍽️ ${spot.name}</strong> — ${spot.building || ""} ${spot.floor ? "(" + spot.floor + ")" : ""}<br>
            <span style="font-size:12px; color:#67707E;">${spot.description || ""}</span>
          </div>`
        ).join("");
      }
      const html = `
        <span class="cb-loc-name">🍽️ Canteen, Snacks & Dining Info</span>
        <p style="margin:0 0 6px;">🍔☕🍛 Here’s what’s recorded for food & dining on campus—plus nearby hangout & refreshment spots around the gates/buildings:</p>
        ${listHtml}
        <div class="cb-chip-row">
          <button type="button" data-q="Dining Hall">🍛 Dining Hall</button>
          <button type="button" data-q="Kitchen">👨‍🍳 Kitchen</button>
          <button type="button" data-q="Vastu Bhandar">🛍️ Vastu Bhandar</button>
        </div>
      `;
      const fDiv = addMsg(html, "bot", true);
      fDiv.querySelectorAll("[data-q]").forEach(btn => {
        btn.addEventListener("click", () => ask(btn.getAttribute("data-q")));
      });
      return;
    }

    if (res.type === "answer") {
      showAnswerCard(res.loc);
      return;
    }

    if (res.type === "category_list") {
      const botDiv = addMsg(res.title, "bot");
      const chipRow = document.createElement("div");
      chipRow.className = "cb-chip-row";
      res.options.forEach(l => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = `${getLocationEmoji(l)} ${l.name} (${l.building_id || l.building || ""})`;
        btn.onclick = () => {
          ask(l.name);
        };
        chipRow.appendChild(btn);
      });
      botDiv.appendChild(chipRow);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return;
    }

    addMsg("🤔 I couldn't find that exact spot on campus. Try 'Canteen & Food 🍽️', 'Principal Office 🏛️', 'FE HOD Office', 'Library 📚', or a room number like '301A'.", "bot");
  }

  function showAnswerCard(loc) {
    const emoji = getLocationEmoji(loc);
    const metaParts = [
      loc.building ? `🏢 ${loc.building}` : "",
      loc.floor ? `🪜 ${loc.floor}` : "",
      loc.rooms ? `🚪 Room ${loc.rooms}` : ""
    ].filter(Boolean).join(" · ");

    const verifyHtml = loc.needs_verification && loc.verify_note
      ? `<div class="cb-verify-note">📌 Note: ${loc.verify_note}</div>`
      : "";

    const html = `
      <span class="cb-loc-name">${emoji} ${loc.name}</span>
      <div class="cb-meta-pill">${metaParts}</div>
      <p style="margin:0 0 4px;">${loc.description || ""}</p>
      ${verifyHtml}
    `;
    const botDiv = addMsg(html, "bot", true);

    const place = placeForBuilding((loc.building || "") + " " + (loc.name || ""));
    if (place) {
      const navBtn = document.createElement("button");
      navBtn.type = "button";
      navBtn.className = "cb-nav-btn";
      navBtn.textContent = "🧭 Navigate to " + place;
      navBtn.addEventListener("click", () => openMap(place));
      botDiv.appendChild(navBtn);
    }
  }

  initChat();
})();
</script>
</body>
</html>
