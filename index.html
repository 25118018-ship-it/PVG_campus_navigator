<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVG COET — Campus Guide</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* =========================================================
   PVG COET Campus Guide — chatbot widget styles
   Theme: academic "campus ledger" look — deep navy + brass
   gold, a distinctive serif for headings, clean sans for body.
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

:root{
  --cb-navy:        #10233F;
  --cb-navy-deep:   #0B1930;
  --cb-gold:        #C6981F;
  --cb-gold-soft:   #E7C165;
  --cb-paper:       #FBF8F1;
  --cb-ink:         #1E2430;
  --cb-slate:       #67707E;
  --cb-line:        #E4DCC8;
  --cb-radius:      14px;
  --cb-shadow:      0 18px 40px rgba(11,25,48,0.28);
  --cb-font-head:   'Fraunces', Georgia, serif;
  --cb-font-body:   'Inter', system-ui, sans-serif;
}

#campusBotLauncher, #campusBotPanel, #campusBotPanel *{
  box-sizing: border-box;
  font-family: var(--cb-font-body);
}

/* ---------- Floating launcher ---------- */
.cb-launcher{
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: var(--cb-navy);
  color: var(--cb-gold-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--cb-shadow);
  z-index: 9998;
  transition: transform 0.2s ease;
}
.cb-launcher:hover{ transform: translateY(-2px); }
.cb-launcher-icon{ width: 26px; height: 26px; }
.cb-launcher-logo{
  display: none;
  width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
}

/* ---------- Panel shell ---------- */
.cb-panel{
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  max-width: 100vw;
  max-height: 100vh;
  margin: 0 auto;
  background: var(--cb-paper);
  border-radius: 0;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 9999;
  opacity: 0;
  transform: scale(0.98);
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s ease;
}
.cb-panel.cb-open{
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

/* ---------- Header ---------- */
.cb-header{
  background: linear-gradient(180deg, var(--cb-navy) 0%, var(--cb-navy-deep) 100%);
  padding: 16px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 3px solid var(--cb-gold);
  flex-shrink: 0;
}
.cb-logo{
  width: 40px;
  height: 40px;
  object-fit: contain;
  background: #fff;
  border-radius: 8px;
  padding: 4px;
  flex-shrink: 0;
}
.cb-header-text{ flex: 1; min-width: 0; }
.cb-header-text h1{
  margin: 0;
  font-family: var(--cb-font-head);
  font-weight: 600;
  font-size: 17px;
  color: #fff;
  letter-spacing: 0.2px;
}
.cb-header-text p{
  margin: 2px 0 0;
  font-size: 11.5px;
  color: var(--cb-gold-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cb-close{
  background: transparent;
  border: none;
  color: #EDE7D6;
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  flex-shrink: 0;
}
.cb-close:hover{ background: rgba(255,255,255,0.08); }

/* ---------- Body + watermark background ---------- */
.cb-body{
  position: relative;
  flex: 1;
  overflow: hidden;
  background: var(--cb-paper);
}
.cb-body::before{
  content: "";
  position: absolute;
  inset: 0;
  background-image: url('pvg_entrance.png');
  background-size: cover;
  background-position: center;
  opacity: 0.08;
  filter: grayscale(20%);
  z-index: 0;
}
.cb-messages{
  position: relative;
  z-index: 1;
  height: 100%;
  overflow-y: auto;
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}

/* ---------- Message bubbles ---------- */
.cb-msg{
  max-width: 84%;
  font-size: 13.5px;
  line-height: 1.5;
  padding: 10px 12px;
  border-radius: 12px;
  animation: cb-rise 0.18s ease;
}
@keyframes cb-rise{
  from{ opacity: 0; transform: translateY(6px); }
  to{ opacity: 1; transform: translateY(0); }
}
.cb-msg.bot{
  align-self: flex-start;
  background: #fff;
  color: var(--cb-ink);
  border-left: 3px solid var(--cb-gold);
  box-shadow: 0 2px 8px rgba(16,35,63,0.06);
}
.cb-msg.bot .cb-loc-name{
  display: block;
  font-family: var(--cb-font-head);
  font-weight: 600;
  font-size: 14.5px;
  color: var(--cb-navy);
  margin-bottom: 3px;
}
.cb-msg.user{
  align-self: flex-end;
  background: var(--cb-navy);
  color: #F6F1E3;
}
.cb-msg .cb-chip-row{
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.cb-msg .cb-chip-row button{
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--cb-line);
  background: var(--cb-paper);
  color: var(--cb-navy);
  cursor: pointer;
}
.cb-msg .cb-chip-row button:hover{ border-color: var(--cb-gold); }

/* typing indicator */
.cb-typing{
  align-self: flex-start;
  display: flex;
  gap: 4px;
  padding: 10px 14px;
  background: #fff;
  border-left: 3px solid var(--cb-gold);
  border-radius: 12px;
}
.cb-typing span{
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cb-slate);
  animation: cb-bounce 1s infinite ease-in-out;
}
.cb-typing span:nth-child(2){ animation-delay: 0.15s; }
.cb-typing span:nth-child(3){ animation-delay: 0.3s; }
@keyframes cb-bounce{
  0%, 60%, 100%{ transform: translateY(0); opacity: 0.5; }
  30%{ transform: translateY(-4px); opacity: 1; }
}

/* ---------- Quick suggestion chips ---------- */
.cb-suggestions{
  flex-shrink: 0;
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  overflow-x: auto;
  border-top: 1px solid var(--cb-line);
  background: var(--cb-paper);
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}
.cb-chip{
  flex-shrink: 0;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--cb-line);
  background: #fff;
  color: var(--cb-navy);
  cursor: pointer;
  white-space: nowrap;
}
.cb-chip:hover{ border-color: var(--cb-gold); background: #FFFBF0; }

/* ---------- Input row ---------- */
.cb-input-row{
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--cb-line);
  background: #fff;
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}
#campusBotInput{
  flex: 1;
  border: 1px solid var(--cb-line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13.5px;
  outline: none;
  background: var(--cb-paper);
  color: var(--cb-ink);
}
#campusBotInput:focus{ border-color: var(--cb-gold); }
.cb-send{
  width: 40px;
  border: none;
  border-radius: 10px;
  background: var(--cb-navy);
  color: var(--cb-gold-soft);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.cb-send:hover{ background: var(--cb-navy-deep); }

/* ---------- Credit line ---------- */
.cb-credit{
  flex-shrink: 0;
  text-align: center;
  font-size: 11px;
  color: var(--cb-slate);
  background: #fff;
  padding: 6px 0 10px;
  margin: 0;
}
/* Live map navigation — uses the colours from style.css */

.cb-map-chip{
  flex-shrink: 0;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--cb-gold);
  background: var(--cb-navy);
  color: var(--cb-gold-soft);
  cursor: pointer;
  white-space: nowrap;
}
.cb-map-chip:hover{ background: var(--cb-navy-deep); }

.cb-nav-btn{
  display: block;
  margin-top: 10px;
  font-size: 12.5px;
  font-weight: 600;
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  background: var(--cb-navy);
  color: var(--cb-gold-soft);
  cursor: pointer;
}
.cb-nav-btn:hover{ background: var(--cb-navy-deep); }

/* Map screen */
.cm-panel{
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: none;
  flex-direction: column;
  background: var(--cb-paper);
  font-family: var(--cb-font-body);
}
.cm-panel.cm-open{ display: flex; }
.cm-panel *{ box-sizing: border-box; }

#campusMap{ flex: 1; min-height: 0; }

.cm-controls{
  flex-shrink: 0;
  display: grid;
  gap: 8px;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 16px 14px;
  background: #fff;
  border-top: 1px solid var(--cb-line);
}
.cm-controls label{ display: grid; gap: 3px; font-size: 13px; font-weight: 600; color: var(--cb-navy); }
.cm-controls select{
  font: inherit; font-weight: 400; padding: 9px;
  border: 1px solid var(--cb-line); border-radius: 8px;
  background: var(--cb-paper); color: var(--cb-ink);
}
.cm-row{ display: flex; gap: 8px; }
.cm-controls button{
  font: inherit; font-weight: 600; padding: 11px 14px;
  border: none; border-radius: 8px; cursor: pointer;
}
#cmGo{ flex: 1; background: var(--cb-navy); color: var(--cb-gold-soft); }
#cmStop{ background: #EDE7D6; color: var(--cb-navy); }
.cm-controls button:disabled{ opacity: .5; cursor: default; }
#cmStatus{ margin: 0; font-size: 14px; color: var(--cb-ink); min-height: 1.3em; }

</style>
</head>
<body>

<!-- Floating launcher button -->
<button id="campusBotLauncher" class="cb-launcher" aria-label="Open campus assistant" aria-expanded="false">
  <img src="pvg_logo.png" alt="" class="cb-launcher-logo">
  <svg viewBox="0 0 24 24" class="cb-launcher-icon" aria-hidden="true">
    <path d="M12 2C7.6 2 4 5.6 4 10c0 5.7 6.9 11 7.2 11.2.5.4 1.1.4 1.6 0C13.1 21 20 15.7 20 10c0-4.4-3.6-8-8-8Z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
    <circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.6" fill="none"/>
  </svg>
</button>

<!-- Chat panel -->
<section id="campusBotPanel" class="cb-panel" aria-hidden="true">

  <header class="cb-header">
    <img src="pvg_logo.png" alt="College crest" class="cb-logo">
    <div class="cb-header-text">
      <h1>Campus Guide</h1>
      <p>PVG's College of Engineering &amp; Technology</p>
    </div>
    <button id="campusBotClose" class="cb-close" aria-label="Close chat">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <div class="cb-body">
    <div class="cb-messages" id="campusBotMessages" role="log" aria-live="polite"></div>
  </div>

  <div class="cb-suggestions" id="campusBotSuggestions">
    <button class="cb-map-chip" id="cbMapChip" type="button">🧭 Live map</button>
    <button class="cb-chip" data-query="Good morning">👋 Hi / Morning</button>
    <button class="cb-chip" data-query="FE HOD office">HOD Office</button>
    <button class="cb-chip" data-query="Computer lab">Computer Lab</button>
    <button class="cb-chip" data-query="Library">Library</button>
    <button class="cb-chip" data-query="Canteen">Canteen</button>
    <button class="cb-chip" data-query="Mechanical lab">Mechanical Lab</button>
  </div>

  <form id="campusBotForm" class="cb-input-row">
    <input id="campusBotInput" type="text" placeholder="Ask e.g. where's the computer lab..." autocomplete="off">
    <button type="submit" class="cb-send" aria-label="Send message">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M3 11l18-8-8 18-2.5-7.5L3 11Z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </form>

  <p class="cb-credit">Made by Ganesh Umape</p>
</section>

<!-- Live map screen -->
<section id="campusMapPanel" class="cm-panel" aria-hidden="true">
  <header class="cb-header">
    <button id="campusMapBack" class="cb-close" aria-label="Back to chat">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="cb-header-text">
      <h1>Live map navigation</h1>
      <p>Walk from one building to another</p>
    </div>
  </header>

  <div id="campusMap"></div>

  <div class="cm-controls">
    <label>From <select id="cmFrom"></select></label>
    <label>To <select id="cmTo"></select></label>
    <div class="cm-row">
      <button id="cmGo" type="button">Start navigation</button>
      <button id="cmStop" type="button" disabled>Stop</button>
    </div>
    <p id="cmStatus" aria-live="polite"></p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script>
(function () {

  /* ---------------------------------------------------------
     1) CAMPUS DATA (Merged with your full dataset)
  --------------------------------------------------------- */
  const LOCATIONS = [

      directions: "Classrooms 201, 202 & 203 are opposite the gents toilet on the 2nd floor.",

    {

      directions: "Walk past Block B towards the sports ground — the canteen is on your left.",
      keywords: ["canteen", "cafeteria", "food court", "mess", "cafe", "lunch place"]
    },
    {
      id: "exam-cell",
      name: "Examination Cell",
      building: "Admin Block, 1st Floor",
      directions: "Take the admin block stairs to the 1st floor; it's next to the accounts office.",
      keywords: ["exam cell", "examination", "exam office", "exam department", "hall ticket"]
    },
    {
      id: "placement-cell",
      name: "Training & Placement Cell",
      building: "Admin Block, 2nd Floor",
      directions: "2nd floor of the admin block, at the end of the corridor.",
      keywords: ["placement cell", "placement office", "tpo", "training and placement", "placement"]
    }
  ];

  /* ---------------------------------------------------------
     2) GREETINGS & CASUAL CHAT
  --------------------------------------------------------- */
  const GREETINGS = new Set([
    "hi", "hii", "hiii", "hey", "heyy", "hello", "helo", "hallo",
    "namaste", "namaskar", "good morning", "good afternoon",
    "good evening", "gm", "yo", "sup", "bye", "goodbye", "thanks", "thank you"
  ]);

  function isGreeting(query) {
    const cleaned = normalize(query);
    return GREETINGS.has(cleaned) || [...GREETINGS].some(g => cleaned.includes(g));
  }

  function getGreetingReply(query) {
    const q = normalize(query);
    if (q.includes("bye") || q.includes("goodbye")) {
      return "👋 Goodbye! Have a great day at PVG campus!";
    }
    if (q.includes("thank")) {
      return "You're very welcome! Let me know if you need any other location assistance.";
    }
    return "👋 Hello! Welcome to PVG's COET Campus Assistant. Ask me where any office, lab, or facility is — or ask me about the college itself.";
  }

  /* ---------------------------------------------------------
     3) ABOUT THE COLLEGE
  --------------------------------------------------------- */
  const ABOUT_COLLEGE = [
    {
      keywords: ["what is pvg", "about pvg", "about college", "about this college", "what is this college", "college information", "college info", "full form", "what does pvg stand for"],
      answer: "PVG's College of Engineering and Technology (PVGCOET) is a private engineering college in Pune, run by Pune Vidyarthi Griha. It's affiliated with Savitribai Phule Pune University and holds a NAAC 'A' accreditation."
    },
    {
      keywords: ["established", "establish", "founded", "founding", "when was it established", "history", "how old", "since when"],
      answer: "PVGCOET was established in 1985."
    },
    {
      keywords: ["where is this college", "college location", "located", "address", "where is pvg", "which area", "where in pune"],
      answer: "The college is located in Vidya Nagari, Shivdarshan, Parvati, Pune – 411009, Maharashtra."
    }
  ];

  function findAboutMatch(query) {
    const queryTokens = tokenize(query);
    const normalizedQuery = normalize(query);
    let best = null;
    let bestScore = 0;

    for (const item of ABOUT_COLLEGE) {
      let score = 0;
      for (const alias of item.keywords) {
        const normAlias = normalize(alias);
        if (normalizedQuery.includes(normAlias)) { score += 4; continue; }
        const aliasTokens = normAlias.split(" ").filter(Boolean);
        for (const qWord of queryTokens) {
          for (const aWord of aliasTokens) {
            if (qWord === aWord) score += 2;
            else if (fuzzyWordMatch(qWord, aWord)) score += 1;
          }
        }
      }
      if (score > bestScore) { bestScore = score; best = item; }
    }
    return bestScore >= 3 ? best : null;
  }

  /* ---------------------------------------------------------
     4) TEXT MATCHING ENGINE
  --------------------------------------------------------- */
  const STOPWORDS = new Set([
    "where","is","are","was","the","a","an","i","want","to","find","please",
    "can","you","tell","me","show","us","in","of","for","my","how","do",
    "does","get","reach","need","needed","looking","location","locate",
    "this","that","these","those","it","go","going","there","near","nearby",
    "and","or","at","on","with","hey","hi","hello"
  ]);

  function normalize(str) {
    return str.toLowerCase().replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim();
  }

  function tokenize(str) {
    return normalize(str)
      .split(" ")
      .filter(w => w.length > 0 && !STOPWORDS.has(w));
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      }
    }
    return dp[m][n];
  }

  function fuzzyWordMatch(a, b) {
    if (a === b) return true;
    const shortest = Math.min(a.length, b.length);
    const tolerance = shortest <= 4 ? 1 : shortest <= 7 ? 2 : 3;
    return levenshtein(a, b) <= tolerance;
  }

  function scoreLocation(loc, queryTokens, normalizedQuery) {
    let score = 0;
    for (const alias of loc.keywords) {
      const normAlias = normalize(alias);
      if (normalizedQuery.includes(normAlias)) {
        score += 4;
        continue;
      }
      const aliasTokens = normAlias.split(" ").filter(Boolean);
      for (const qWord of queryTokens) {
        for (const aWord of aliasTokens) {
          if (qWord === aWord) score += 2;
          else if (fuzzyWordMatch(qWord, aWord)) score += 1;
        }
      }
    }
    return score;
  }

  function findMatches(query) {
    const queryTokens = tokenize(query);
    const normalizedQuery = normalize(query);
    if (queryTokens.length === 0) return [];

    return LOCATIONS
      .map(loc => ({ loc, score: scoreLocation(loc, queryTokens, normalizedQuery) }))
      .filter(r => r.score > 0)
      .sort((a, b) => b.score - a.score);
  }

  const CONFIDENT_THRESHOLD = 3;

  function buildReply(query) {
    if (isGreeting(query)) {
      return { text: getGreetingReply(query) };
    }

    const aboutMatch = findAboutMatch(query);
    if (aboutMatch) {
      return { text: aboutMatch.answer };
    }

    const matches = findMatches(query);

    if (matches.length === 0) {
      return {
        text: "I couldn't match that to a place on campus yet. Try naming the place directly — e.g. \"library\", \"FE HOD office\", \"computer lab\" — or tap one of the suggestions below.",
        chips: LOCATIONS.slice(0, 4).map(l => l.name)
      };
    }

    const top = matches[0];
    const runnerUp = matches[1];

    if (top.score >= CONFIDENT_THRESHOLD && (!runnerUp || top.score - runnerUp.score >= 2)) {
      return {
        locName: top.loc.name,
        text: `${top.loc.building}. ${top.loc.directions}`
      };
    }

    const options = matches.slice(0, 3).map(m => m.loc.name);
    return {
      text: `Did you mean one of these?`,
      chips: options
    };
  }

  /* ---------------------------------------------------------
     5) UI WIRING
  --------------------------------------------------------- */
  const launcher = document.getElementById("campusBotLauncher");
  const panel = document.getElementById("campusBotPanel");
  const closeBtn = document.getElementById("campusBotClose");
  const messagesEl = document.getElementById("campusBotMessages");
  const form = document.getElementById("campusBotForm");
  const input = document.getElementById("campusBotInput");
  const chipsBar = document.getElementById("campusBotSuggestions");

  let greeted = false;

  function openPanel() {
    panel.classList.add("cb-open");
    panel.setAttribute("aria-hidden", "false");
    launcher.setAttribute("aria-expanded", "true");
    if (!greeted) {
      addBotMessage({ text: "Hi! I'm your PVG campus assistant. Ask me where any lab, office, or facility is." });
      greeted = true;
    }
    input.focus();
  }
  function closePanel() {
    panel.classList.remove("cb-open");
    panel.setAttribute("aria-hidden", "true");
    launcher.setAttribute("aria-expanded", "false");
  }

  launcher.addEventListener("click", () => {
    panel.classList.contains("cb-open") ? closePanel() : openPanel();
  });
  closeBtn.addEventListener("click", closePanel);

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addUserMessage(text) {
    const div = document.createElement("div");
    div.className = "cb-msg user";
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function addBotMessage({ text, locName, chips }) {
    const div = document.createElement("div");
    div.className = "cb-msg bot";

    if (locName) {
      const nameEl = document.createElement("span");
      nameEl.className = "cb-loc-name";
      nameEl.textContent = locName;
      div.appendChild(nameEl);
    }

    const textEl = document.createElement("span");
    textEl.textContent = text;
    div.appendChild(textEl);

    if (chips && chips.length) {
      const row = document.createElement("div");
      row.className = "cb-chip-row";
      chips.forEach(label => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = label;
        btn.addEventListener("click", () => handleQuery(label));
        row.appendChild(btn);
      });
      div.appendChild(row);
    }

    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "cb-typing";
    div.id = "cbTypingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    scrollToBottom();
  }
  function hideTyping() {
    const el = document.getElementById("cbTypingIndicator");
    if (el) el.remove();
  }

  function handleQuery(rawText) {
    const text = rawText.trim();
    if (!text) return;
    addUserMessage(text);
    input.value = "";
    showTyping();
    setTimeout(() => {
      hideTyping();
      addBotMessage(buildReply(text));
    }, 420);
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    handleQuery(input.value);
  });

  chipsBar.addEventListener("click", e => {
    const btn = e.target.closest(".cb-chip");
    if (btn) handleQuery(btn.dataset.query);
  });

  openPanel();

})();

(function () {

  /* 1) Pin points (latitude, longitude) */
  const PLACES = [
    { name: "PVG College Gate", lat: 18.489722, lng: 73.853583 },
    { name: "Girls Hostel", lat: 18.489556, lng: 73.853528 },
    { name: "Boys Hostel", lat: 18.489889, lng: 73.853306 },
    { name: "Cycle Parking", lat: 18.489556, lng: 73.853222 },
    { name: "Library & Workshop Building", lat: 18.489444, lng: 73.852111 },
    { name: "Muktangan Playground", lat: 18.490028, lng: 73.851472 },
    { name: "Muktangan English Medium School", lat: 18.489917, lng: 73.851917 },
    { name: "MBA 2nd Building", lat: 18.490250, lng: 73.853361 },
    { name: "MBA Building", lat: 18.490188, lng: 73.853063 },
    { name: "FE Building", lat: 18.489888, lng: 73.853578 },
    { name: "Main Building", lat: 18.489938, lng: 73.852438 }
  ];

  /* 2) Which words in a chatbot answer point to which pin.
        Add a line here when you collect a new building's coordinates. */
  const BUILDINGS = [
    [/fe building/i, "FE Building"],
    [/boys hostel/i, "Boys Hostel"],
    [/girls hostel/i, "Girls Hostel"],
    [/main building/i, "Main Building"],
    [/muktangan/i, "Muktangan English Medium School"],
    [/auditorium/i, "Library & Workshop Building"]
  ];

  const ARRIVED_M = 20;      // GPS is rarely more accurate than this
  const WALK_M_PER_MIN = 80;

  const $ = id => document.getElementById(id);
  const panel = $("campusMapPanel"), fromSel = $("cmFrom"), toSel = $("cmTo");
  const goBtn = $("cmGo"), stopBtn = $("cmStop");
  const say = t => { $("cmStatus").textContent = t; };

  let map = null, me = null, route = null, trail = null;
  let trailPts = [], watchId = null, dest = null, destLL = null, first = true;
  const routeStyle = { color: "#10233F", weight: 5, dashArray: "8 10" };

  /* Dropdowns */
  fromSel.add(new Option("My current location", "gps"));
  toSel.add(new Option("Select destination", ""));
  PLACES.forEach((p, i) => { fromSel.add(new Option(p.name, i)); toSel.add(new Option(p.name, i)); });

  /* Distance in metres between two [lat, lng] points */
  const rad = x => x * Math.PI / 180;
  function dist(a, b) {
    const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
    return 2 * 6371000 * Math.asin(Math.sqrt(h));
  }

  function initMap() {
    if (map) return;
    map = L.map("campusMap").setView([18.4898, 73.8527], 18);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap contributors"
    }).addTo(map);
    PLACES.forEach((p, i) => {
      L.circleMarker([p.lat, p.lng], { radius: 8, color: "#10233F", weight: 3, fillColor: "#C6981F", fillOpacity: 1 })
        .addTo(map).bindTooltip(p.name)
        .on("click", () => { toSel.value = i; });
    });
  }

  function clearLayers() {
    [me, route, trail].forEach(l => l && map.removeLayer(l));
    me = route = trail = null; trailPts = [];
  }

  function stop() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    goBtn.disabled = false; stopBtn.disabled = true;
  }

  function start() {
    if (toSel.value === "") { say("Select a destination first."); return; }
    if (!navigator.geolocation) { say("This browser can’t share your location."); return; }
    stop(); clearLayers();
    dest = PLACES[toSel.value]; destLL = [dest.lat, dest.lng]; first = true;
    trail = L.polyline([], { color: "#C6981F", weight: 5 }).addTo(map);

    if (fromSel.value !== "gps") {
      const f = PLACES[fromSel.value];
      route = L.polyline([[f.lat, f.lng], destLL], routeStyle).addTo(map);
      map.fitBounds(route.getBounds(), { padding: [60, 60] });
      say(`${Math.round(dist([f.lat, f.lng], destLL))} m from ${f.name} to ${dest.name}. Waiting for your GPS location…`);
    } else {
      say("Finding your location…");
    }
    watchId = navigator.geolocation.watchPosition(onPos, onErr,
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    goBtn.disabled = true; stopBtn.disabled = false;
  }

  function onPos(pos) {
    const here = [pos.coords.latitude, pos.coords.longitude];
    if (!me) me = L.circleMarker(here, { radius: 9, color: "#fff", weight: 3, fillColor: "#1f6feb", fillOpacity: 1 }).addTo(map);
    else me.setLatLng(here);
    trailPts.push(here); trail.setLatLngs(trailPts);

    if (fromSel.value === "gps") {
      if (route) map.removeLayer(route);
      route = L.polyline([here, destLL], routeStyle).addTo(map);
    }
    if (first) { map.fitBounds([here, destLL], { padding: [60, 60] }); first = false; }

    const d = dist(here, destLL);
    if (d <= ARRIVED_M) { say(`You have arrived at ${dest.name}.`); stop(); return; }
    const mins = Math.max(1, Math.round(d / WALK_M_PER_MIN));
    const weak = pos.coords.accuracy > 50 ? ` GPS signal is weak (±${Math.round(pos.coords.accuracy)} m).` : "";
    say(`${Math.round(d)} m to ${dest.name}, about ${mins} min walk.${weak}`);
  }

  function onErr(e) {
    const msg = {
      1: "Location is blocked. Allow location for this site in your browser settings, then try again.",
      2: "Your location is not available. Move to an open area and try again.",
      3: "Finding your location took too long. Move to an open area and try again."
    };
    say(msg[e.code] || "Could not get your location.");
    stop();
  }

  /* Open and close the map screen */
  function open(destName) {
    panel.classList.add("cm-open");
    panel.setAttribute("aria-hidden", "false");
    initMap();
    setTimeout(() => map.invalidateSize(), 60);
    if (destName) {
      const i = PLACES.findIndex(p => p.name === destName);
      if (i >= 0) toSel.value = i;
      say("Tap Start navigation when you are ready to walk.");
    } else {
      say("Choose your destination, then tap Start navigation.");
    }
  }
  function close() {
    stop();
    panel.classList.remove("cm-open");
    panel.setAttribute("aria-hidden", "true");
  }

  function placeForBuilding(text) {
    const hit = BUILDINGS.find(b => b[0].test(text));
    return hit ? hit[1] : null;
  }

  goBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", () => { stop(); say("Navigation stopped."); });
  $("campusMapBack").addEventListener("click", close);
  $("cbMapChip").addEventListener("click", () => open());

  /* 3) Add a "Navigate" button under every chatbot answer that names a mapped building */
  new MutationObserver(list => {
    list.forEach(m => m.addedNodes.forEach(n => {
      if (!(n instanceof HTMLElement) || !n.classList.contains("bot")) return;
      if (!n.querySelector(".cb-loc-name")) return;
      const place = placeForBuilding(n.textContent);
      if (!place) return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cb-nav-btn";
      btn.textContent = "Navigate to " + place;
      btn.addEventListener("click", () => open(place));
      n.appendChild(btn);
    }));
  }).observe($("campusBotMessages"), { childList: true });

  window.CampusMap = { open, close };

})();

</script>
