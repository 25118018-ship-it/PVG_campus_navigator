<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVG COET — Campus Guide</title>
<style>
  :root {
    --paper: #F6F3EC;
    --paper-card: #FFFFFF;
    --paper-tint: #FBF9F4;
    --ink: #1E2A33;
    --ink-muted: #5B6B74;
    --navy: #1E3A4C;
    --navy-dark: #14262F;
    --brass: #B8863B;
    --brass-soft: #EFE5D1;
    --line: #D9D2C2;
    --warn-bg: #FFF8E7;
    --warn-ink: #8A5A00;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .site-header {
    background: var(--paper);
    border-bottom: 2px solid var(--navy);
    padding: 1rem 1.25rem;
    flex-shrink: 0;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    max-width: 720px;
    margin: 0 auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .brand-mark {
    font-family: system-ui, -apple-system, Arial, sans-serif;
    font-weight: 800;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--paper);
    background: var(--navy);
    border: 1.5px solid var(--brass);
    border-radius: 7px;
    padding: 0.45rem 0.6rem;
  }

  .brand-text h1 {
    margin: 0;
    font-size: 1.35rem;
    color: var(--navy);
    line-height: 1.15;
  }

  .brand-text p {
    margin: 0.15rem 0 0;
    font-family: system-ui, -apple-system, Arial, sans-serif;
    font-size: 0.82rem;
    color: var(--ink-muted);
  }

  .clear-btn {
    font-family: system-ui, -apple-system, Arial, sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--navy);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.4rem 0.75rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .clear-btn:hover {
    background: var(--brass-soft);
    border-color: var(--brass);
  }

  .chat-shell {
    flex: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem 1.25rem 0.75rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    padding-right: 4px;
    padding-bottom: 1rem;
    scroll-behavior: smooth;
  }

  .message {
    font-family: system-ui, -apple-system, Arial, sans-serif;
    font-size: 0.94rem;
    line-height: 1.5;
    padding: 0.85rem 1.05rem;
    border-radius: 12px;
    max-width: 88%;
    animation: fadeIn 0.18s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message p { margin: 0 0 0.5rem; }
  .message p:last-child { margin-bottom: 0; }

  .message.bot {
    background: var(--paper-card);
    border: 1px solid var(--line);
    align-self: flex-start;
    border-top-left-radius: 3px;
    box-shadow: 0 1px 3px rgba(30, 42, 51, 0.04);
  }

  .message.user {
    background: var(--navy);
    color: var(--paper);
    align-self: flex-end;
    border-top-right-radius: 3px;
  }

  .examples {
    margin: 0.35rem 0 0;
    padding-left: 1.15rem;
    color: var(--ink-muted);
    font-size: 0.88rem;
  }
  .examples li {
    margin-bottom: 0.2rem;
    cursor: pointer;
  }
  .examples li:hover {
    color: var(--navy);
    text-decoration: underline;
  }

  .result-card {
    background: var(--paper-tint);
    border: 1px solid #E5DEC9;
    border-left: 4px solid var(--brass);
    padding: 0.75rem 0.9rem;
    margin-top: 0.55rem;
    border-radius: 6px;
  }
  .result-card:first-child { margin-top: 0; }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.25rem;
  }

  .result-name {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 1.04rem;
    color: var(--navy);
  }

  .room-badge {
    font-size: 0.74rem;
    font-weight: 700;
    background: var(--navy);
    color: var(--paper);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    white-space: nowrap;
  }

  .result-meta {
    font-size: 0.81rem;
    font-weight: 600;
    color: #7D6B49;
    margin-bottom: 0.45rem;
  }

  .result-desc {
    font-size: 0.91rem;
    color: var(--ink);
    margin: 0;
  }

  .warn-tag {
    display: inline-block;
    margin-top: 0.5rem;
    font-size: 0.76rem;
    background: var(--warn-bg);
    color: var(--warn-ink);
    border: 1px solid #F0D9A0;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    margin-top: 0.65rem;
  }

  .quick-bar {
    display: flex;
    gap: 0.45rem;
    overflow-x: auto;
    padding-bottom: 0.55rem;
    scrollbar-width: none;
  }
  .quick-bar::-webkit-scrollbar { display: none; }

  button.chip {
    font-family: system-ui, -apple-system, Arial, sans-serif;
    border: 1px solid var(--brass);
    background: var(--paper-tint);
    color: var(--navy);
    border-radius: 999px;
    padding: 0.36rem 0.8rem;
    font-size: 0.81rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  button.chip:hover {
    background: var(--brass);
    color: #FFFFFF;
  }

  .input-dock {
    border-top: 1px solid var(--line);
    padding-top: 0.7rem;
    flex-shrink: 0;
  }

  .chat-input-row {
    display: flex;
    gap: 0.5rem;
  }

  #chat-input {
    flex: 1;
    font-family: system-ui, -apple-system, Arial, sans-serif;
    font-size: 0.95rem;
    padding: 0.72rem 0.95rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #FFFFFF;
    color: var(--ink);
  }
  #chat-input:focus {
    outline: 2px solid var(--navy);
    outline-offset: 1px;
  }

  .mic-btn {
    background: #FFFFFF;
    color: var(--navy);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 0.85rem;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mic-btn.listening {
    background: #B91C1C;
    color: #FFFFFF;
    border-color: #B91C1C;
  }

  .ask-btn {
    font-family: system-ui, -apple-system, Arial, sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    background: var(--navy);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    padding: 0 1.35rem;
    cursor: pointer;
  }
  .ask-btn:hover { background: var(--navy-dark); }

  .site-footer {
    text-align: center;
    font-family: system-ui, -apple-system, Arial, sans-serif;
    font-size: 0.74rem;
    color: #7A868E;
    padding: 0.55rem 0 0.25rem;
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">PVG</span>
        <div class="brand-text">
          <h1>Campus Guide</h1>
          <p id="status-subtitle">PVG's College of Engineering &amp; Technology</p>
        </div>
      </div>
      <button type="button" class="clear-btn" id="clear-btn">Clear</button>
    </div>
  </header>

  <main class="chat-shell">
    <div id="chat-log" class="chat-log"></div>

    <div class="input-dock">
      <div class="quick-bar" id="quick-bar"></div>
      <form id="chat-form" class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Ask e.g. where is the principal office?" autocomplete="off" required>
        <button type="button" id="mic-btn" class="mic-btn">🎤</button>
        <button type="submit" class="ask-btn">Ask</button>
      </form>
      <footer class="site-footer">
        PVG's College of Engineering and Technology &middot; Made by Ganesh Umape
      </footer>
    </div>
  </main>

  <script>
    const norm = s => (s || '')
      .toLowerCase()
      .replace(/['’]/g, '')
      .replace(/&/g, ' and ')
      .replace(/[^a-z0-9 ]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    const has = (q, k) => (' ' + q + ' ').includes(' ' + k + ' ');

    let DATA = null;
    let BLD = [];
    let VOCAB = new Set();

    function initData(raw) {
      if (Array.isArray(raw)) {
        const bMap = new Map();
        const locations = raw.map((item, idx) => {
          const bName = item.building || 'Main Campus';
          const bId = norm(bName).replace(/\s+/g, '_') || 'main';
          if (!bMap.has(bId)) bMap.set(bId, { id: bId, name: bName, aliases: [bName] });
          return {
            id: item.id || idx,
            name: item.name || 'Unnamed Location',
            building_id: bId,
            building: bName,
            category: item.category || '',
            floor: item.floor || '',
            rooms: item.roomNo || item.rooms || '',
            description: item.location || item.description || 'No detailed directions recorded yet.',
            keywords: [item.name, item.category, item.roomNo, item.rooms, item.building].filter(Boolean),
            needs_verification: Boolean(item.needs_verification)
          };
        });
        DATA = { buildings: [...bMap.values()], locations };
      } else {
        DATA = raw;
      }

      BLD = (DATA.buildings || []).map(b => ({
        id: b.id,
        name: b.name,
        aliases: [...new Set([...(b.aliases || []), b.name].map(norm))].filter(Boolean)
      }));

      (DATA.locations || []).forEach(l => {
        const rawKws = [...(l.keywords || []), l.name, l.category, l.rooms ? 'room ' + l.rooms : ''];
        l._kw = [...new Set(rawKws.map(norm))].filter(k => k && !/^\d{1,2}$/.test(k));
        l._blob = norm([l.name, l.category, l.description, l.floor, l.rooms, l.building].filter(Boolean).join(' '));
        l._kw.forEach(k => k.split(' ').forEach(w => w.length >= 4 && VOCAB.add(w)));
      });

      const sub = document.getElementById('status-subtitle');
      if (sub && DATA.locations.length) {
        sub.textContent = `PVG's College of Engineering & Technology · ${DATA.locations.length} locations indexed`;
      }
    }

    function search(raw) {
      let q = norm(raw);

      // --- SMART BROAD CATEGORY INTERCEPTORS ---
      // If user types just "office" or asks for offices in general, list all offices
      if (q === 'office' || q === 'offices') {
        const offices = DATA.locations.filter(l => norm(l.name).includes('office') || norm(l.category).includes('office'));
        return { type: 'category_list', title: 'Here are the offices available on campus:', options: offices };
      }

      // If user types "washroom" or "toilet", list washrooms across buildings
      if (q.includes('washroom') || q.includes('toilet') || q.includes('restroom')) {
        const washrooms = DATA.locations.filter(l => norm(l.name).includes('washroom') || norm(l.name).includes('toilet') || norm(l.category).includes('washroom'));
        return { type: 'category_list', title: 'Here are the washrooms available across campus buildings:', options: washrooms };
      }
      // ----------------------------------------

      let sc = DATA.locations
        .map(l => {
          let s = 0;
          l._kw.forEach(k => {
            if (has(q, k)) s += k.split(' ').length * 3;
            else if (q.includes(k) || k.includes(q)) s += 1;
          });
          if (l._blob && l._blob.includes(q)) s += 2;
          return { l, s };
        })
        .filter(x => x.s > 0);

      if (!sc.length) {
        // Fallback token search
        const tokens = q.split(' ').filter(w => w.length > 2);
        sc = DATA.locations
          .map(l => {
            let s = 0;
            tokens.forEach(t => {
              if (l._blob && l._blob.includes(t)) s += 1;
            });
            return { l, s };
          })
          .filter(x => x.s > 0);
      }

      if (!sc.length) return { type: 'none' };

      sc.sort((a, b) => b.s - a.s);
      const max = sc[0].s;
      const top = sc.filter(x => x.s === max).map(x => x.l);

      if (top.length === 1) return { type: 'answer', loc: top[0] };
      return { type: 'ask_which', options: sc.slice(0, 10).map(x => x.l) };
    }

    const chatLog = document.getElementById('chat-log');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const quickBar = document.getElementById('quick-bar');

    const QUICK = ['Principal Office', 'HOD Office', 'Computer Lab', 'Library', 'Washroom', 'Xerox'];

    const bname = id => {
      const found = DATA.buildings.find(b => b.id === id);
      return found ? found.name : id;
    };
    const shortName = n => (n || '').replace(/\s*\(.*?\)/, '');

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function addBotBubble() {
      const div = el('div', 'message bot');
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
      return div;
    }

    function addUserBubble(text) {
      const div = el('div', 'message user');
      div.appendChild(el('p', '', text));
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function makeChip(label, onClick) {
      const btn = el('button', 'chip', label);
      btn.type = 'button';
      btn.onclick = onClick;
      return btn;
    }

    function appendChips(container, items) {
      const wrap = el('div', 'chips');
      items.forEach(([label, fn]) => wrap.appendChild(makeChip(label, fn)));
      container.appendChild(wrap);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function showAnswer(loc) {
      const bubble = addBotBubble();
      const card = el('div', 'result-card');

      const header = el('div', 'result-header');
      header.appendChild(el('span', 'result-name', loc.name));
      if (loc.rooms) {
        header.appendChild(el('span', 'room-badge', 'Room ' + loc.rooms));
      }
      card.appendChild(header);

      const metaText = [shortName(loc.building || bname(loc.building_id)), loc.floor]
        .filter(Boolean)
        .join(' · ');
      if (metaText) {
        card.appendChild(el('div', 'result-meta', metaText));
      }

      card.appendChild(el('p', 'result-desc', loc.description));
      bubble.appendChild(card);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function showWelcome() {
      chatLog.innerHTML = '';
      const bubble = addBotBubble();
      bubble.appendChild(el('p', '', 'Hi! I am your PVG campus assistant. Ask me where any office, lab, washroom, or facility is:'));

      const ul = el('ul', 'examples');
      ['Principal Office', 'FE HOD Office', 'Washroom in Main Building', 'Computer Lab'].forEach(sample => {
        const li = el('li', '', `"${sample}"`);
        li.onclick = () => ask(sample);
        ul.appendChild(li);
      });
      bubble.appendChild(ul);
    }

    function ask(q) {
      const trimmed = q.trim();
      if (!trimmed) return;

      addUserBubble(trimmed);

      if (!DATA) {
        const b = addBotBubble();
        b.appendChild(el('p', '', 'Campus data is still loading. Please try again in a moment.'));
        return;
      }

      if (/^(hi|hii|hello|hey|namaste)\b/i.test(trimmed)) {
        const b = addBotBubble();
        b.appendChild(el('p', '', 'Hello! Ask me where any lab, office, washroom, or facility is on the PVG campus.'));
        return;
      }

      const r = search(trimmed);

      if (r.type === 'answer') {
        return showAnswer(r.loc);
      }

      if (r.type === 'category_list' || r.type === 'ask_which') {
        const b = addBotBubble();
        b.appendChild(el('p', '', r.title || 'Here are the matching locations:'));
        return appendChips(
          b,
          r.options.map(l => {
            const bLabel = shortName(l.building || bname(l.building_id));
            const label = `${l.name} (${bLabel}${l.floor ? ' - ' + l.floor : ''})`;
            return [
              label,
              () => {
                addUserBubble(l.name);
                showAnswer(l);
              }
            ];
          })
        );
      }

      // Fallback
      const b = addBotBubble();
      b.appendChild(el('p', '', 'I could not find that exact match on campus. Try selecting one of these common locations:'));
      appendChips(b, QUICK.map(w => [w, () => ask(w)]));
    }

    QUICK.forEach(w => quickBar.appendChild(makeChip(w, () => ask(w))));

    chatForm.addEventListener('submit', e => {
      e.preventDefault();
      const val = chatInput.value;
      chatInput.value = '';
      ask(val);
    });

    document.getElementById('clear-btn').addEventListener('click', showWelcome);

    showWelcome();

    fetch('campus_data.json')
      .then(r => (r.ok ? r.json() : Promise.reject()))
      .catch(() => fetch('data/campus_data.json').then(r => r.json()))
      .then(initData)
      .catch(() => {
        const b = addBotBubble();
        b.appendChild(el('p', '', 'Could not load campus_data.json. Make sure it is placed in the root folder or inside /data/.'));
      });
  </script>
</body>
</html>
