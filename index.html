<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PVG COET Campus Guide</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Floating Launcher (hidden while open; shown if user closes panel) -->
  <button
    id="campusBotLauncher"
    class="cb-launcher"
    type="button"
    aria-label="Open PVG COET Campus Guide"
  >
    <svg class="cb-launcher-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <img class="cb-launcher-logo" src="pvg_logo.png" alt="" />
  </button>

  <!-- Main Chat Panel (starts open immediately) -->
  <section
    id="campusBotPanel"
    class="cb-panel cb-open"
    role="dialog"
    aria-modal="true"
    aria-label="PVG COET Campus Guide"
    aria-hidden="false"
  >
    <!-- Header -->
    <header class="cb-header">
      <img
        class="cb-logo"
        src="pvg_logo.png"
        alt="PVG COET Logo"
        onerror="this.style.display='none'"
      />

      <!-- Cartoon Mascot -->
      <svg class="cb-mascot" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="34" r="22" fill="#FFF8E7" stroke="#E7C165" stroke-width="2.5" />
        <path d="M12 24L32 14L52 24L32 33L12 24Z" fill="#10233F" stroke="#E7C165" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M48 26V36" stroke="#E7C165" stroke-width="2.2" stroke-linecap="round" />
        <circle cx="48" cy="37.5" r="2.5" fill="#C6981F" />
        <circle cx="25" cy="36" r="2.6" fill="#10233F" />
        <circle cx="39" cy="36" r="2.6" fill="#10233F" />
        <path d="M26 43C28 46.5 36 46.5 38 43" stroke="#10233F" stroke-width="2.3" stroke-linecap="round" />
      </svg>

      <div class="cb-header-text">
        <h1>
          PVG COET Campus Guide
          <span class="cb-live-dot" title="Online"></span>
        </h1>
        <p>Find any lab, office, canteen, or facility across campus</p>
      </div>

      <button
        id="campusBotClose"
        class="cb-close"
        type="button"
        aria-label="Minimize Campus Guide"
        title="Minimize"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Chat Body -->
    <div class="cb-body">
      <div id="campusBotMessages" class="cb-messages" aria-live="polite"></div>
    </div>

    <!-- Quick Suggestion Chips -->
    <div class="cb-suggestions" aria-label="Quick suggestions">
      <button type="button" class="cb-chip" data-q="Canteen & Food">🍽️ Canteen &amp; Food</button>
      <button type="button" class="cb-chip" data-q="Principal Office">🏛️ Principal Office</button>
      <button type="button" class="cb-chip" data-q="FE HOD Office">👔 FE HOD Office</button>
      <button type="button" class="cb-chip" data-q="Computer Lab">💻 Computer Lab</button>
      <button type="button" class="cb-chip" data-q="Library">📚 Library</button>
      <button type="button" class="cb-chip" data-q="Washroom">🚻 Washroom</button>
      <button type="button" class="cb-chip" data-q="2-Wheeler Parking">🏍️ Parking</button>
    </div>

    <!-- Input Row -->
    <form id="campusBotForm" class="cb-input-row">
      <input
        id="campusBotInput"
        type="text"
        placeholder="Ask about any room, office, canteen, or facility..."
        autocomplete="off"
        required
      />
      <button type="submit" class="cb-send" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>

    <!-- Footer Credit -->
    <p class="cb-credit">PVG's College of Engineering and Technology · Made by Ganesh Umape</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
